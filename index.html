<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supermercado Guasimalito</title><meta name="theme-color" content="#0f7a4d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#17211c;--mu:#66756d;--pr:#0f7a4d;--pr2:#e3f4ec;--bd:#dde4e0;--rd:#c0392b;--bl:#2468c9;--am:#c27a0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#19221d;--tx:#e8efeb;--mu:#93a39a;--pr:#3ec586;--pr2:#17342a;--bd:#2a362f;--rd:#ff7b6b;--bl:#6aa3ff;--am:#f0b04a}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 2px;font-size:11px;cursor:pointer}nav button span{display:block;font-size:20px}nav button.on{color:var(--pr);font-weight:700}
.brand{display:none}
main{flex:1;padding:14px 12px 150px;max-width:1100px;margin:0 auto;width:100%}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.k{font-size:12px;color:var(--mu)}.v{font-size:20px;font-weight:700;margin-top:2px;word-break:break-all}.neg{color:var(--rd)}.pos{color:var(--pr)}
.fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--pr);color:#fff;border:0;border-radius:30px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 4px 14px #0004;z-index:6;cursor:pointer}
button.b,input,select,textarea{font:inherit;color:var(--tx)}button.b{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}button.s{background:var(--pr2);color:var(--pr)}button.d{background:var(--rd)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:3px 0 10px}label{font-size:12px;color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{padding:8px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13px}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}#md.o{display:flex}
#bx{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.row{display:flex;gap:8px}.row>*{flex:1}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}td.r,th.r{text-align:right}
.vb{display:flex;align-items:flex-end;gap:5px;height:120px}.vb div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mu)}.vb i{display:block;width:100%;background:var(--pr);border-radius:5px 5px 0 0;min-height:2px}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.hb b{width:96px;font-weight:500;overflow:hidden;text-overflow:ellipsis}.hb u{flex:1;height:12px;background:var(--pr2);border-radius:6px;overflow:hidden;text-decoration:none}.hb u i{display:block;height:100%;background:var(--pr)}.hb em{font-style:normal;width:96px;text-align:right}
.lock{background:var(--am);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:10px}
@media(min-width:800px){nav{position:static;flex-direction:column;width:210px;border:0;border-right:1px solid var(--bd);padding:16px 8px;min-height:100vh}nav button{flex:0;text-align:left;font-size:15px;padding:12px;border-radius:10px;display:flex;gap:10px;align-items:center}nav button span{display:inline;font-size:18px}nav button.on{background:var(--pr2)}
.brand{display:block;font-weight:800;color:var(--pr);padding:8px 12px 18px;font-size:17px}main{padding:24px 28px}.g{grid-template-columns:repeat(3,1fr)}.fab{bottom:24px;right:28px}#md{align-items:center}#bx{border-radius:18px}.c2{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
</style></head><body>
<div id="app"><nav id="nv"></nav><main id="mn"></main></div>
<button class="fab" onclick="openForm()">＋ Registrar</button>
<div id="md" onclick="if(event.target===this)cm()"><div id="bx"></div></div>
<script>
const K='guasimalito_v1',$=i=>document.getElementById(i);
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const P=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const F=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return F(d)};
const mon=s=>{const d=P(s);return addD(s,-((d.getDay()+6)%7))};
const mS=s=>s.slice(0,8)+'01',mE=s=>{const d=P(s);return F(new Date(d.getFullYear(),d.getMonth()+1,0))};
const fm=n=>(n<0?'-':'')+'$'+Math.round(Math.abs(n)).toLocaleString('es-CO');
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dl=s=>P(s).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const dfl=s=>P(s).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const TN={venta:'Venta',gasto:'Gasto',compra:'Compra',ingreso:'Ingreso',traslado:'Traslado',retiro:'Retiro socio',abono:'Abono deuda'};const OUT=['gasto','compra','retiro','abono'];
let S={cfg:{name:'Supermercado Guasimalito',base0:0,nequi0:0,start:td(),cats:['Servicios','Nómina','Arriendo','Transporte','Vigilancia','Papelería','Mantenimiento','Domicilios','Otros'],provs:[]},movs:[],cu:{},log:[]};
try{const x=localStorage.getItem(K);if(x)S=Object.assign(S,JSON.parse(x))}catch(_){}
let IDX={};function reidx(){IDX={};S.movs.forEach(m=>(IDX[m.date]=IDX[m.date]||[]).push(m))}reidx();
let STT='💾 Solo en este dispositivo',DB=null,RO=false,SYNC={},ready=false,tm=null,FN='';
const stt=()=>{const s=$('st');if(s)s.textContent=STT};
function save(){reidx();try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}if(RO){alert('Tu acceso es solo lectura: el cambio no se guardó.');loadCloud();return}clearTimeout(tm);tm=setTimeout(push,400)}
const docsOf=()=>{const o={'app/cfg':{cfg:S.cfg,map:S.map||{},log:S.log||[],debts:S.debts||[]},'app/cu':{cu:S.cu}};for(const d in IDX)if(IDX[d].length)o['mv/'+d]={list:IDX[d]};return o};
async function push(){if(!DB||!ready||RO)return;const n=docsOf();try{for(const p in n){const j=JSON.stringify(n[p]);if(SYNC[p]!==j){await DB.doc(p).set(JSON.parse(j));SYNC[p]=j}}for(const p in SYNC)if(!(p in n)){await DB.doc(p).delete();delete SYNC[p]}STT='☁️ Guardado en la nube'}catch(x){STT='⚠️ No se pudo guardar en la nube'}stt()}
async function loadCloud(){try{if(!DB){DB=mkDB();const r=await myRole();if(!r){DB=null;STT='⛔ Tu correo no tiene permiso';stt();return}RO=r=='viewer'}
 if(!DB){STT='💾 Solo en este dispositivo';stt();return}
 const[a,b,c]=await Promise.all([DB.doc('app/cfg').get(),DB.doc('app/cu').get(),DB.collection('mv').get()]);
 if(!a.exists&&!c.size){ready=true;SYNC={};STT=RO?'🔒 Solo lectura':'☁️ Subiendo tus datos...';stt();if(!RO)await push();return}
 const A=a.exists?a.data():{},n={cfg:A.cfg||S.cfg,map:A.map||{},log:A.log||[],debts:A.debts||[],cu:b.exists?(b.data().cu||{}):{},movs:[]};
 c.docs.forEach(d=>{const x=d.data();if(x&&x.list)n.movs.push(...x.list)});
 S=n;reidx();ready=true;const dd=docsOf();SYNC={};for(const p in dd)SYNC[p]=JSON.stringify(dd[p]);
 try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}STT=RO?'🔒 Solo lectura':'☁️ Guardado en la nube';render()}catch(x){STT='⚠️ Sin conexión a la nube (guardando en el dispositivo)';stt()}}
async function dlf(){let t=$('tb').value;if(FN.endsWith('.csv'))t='\ufeff'+t.split('\n').map(l=>l.split('\t').map(c=>'"'+c.replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download=FN;a.click()}
let tab='cuadre',cdate=td(),flt={a:'',b:'',t:'',s:'',c:''},rk='mes',ra='',rb='';
const sm=(a,f)=>a.reduce((t,m)=>t+f(m),0);
function dayInfo(d){const ms=IDX[d]||[],c=S.cu[d];
 const caja=sm(ms.filter(m=>(m.type=='gasto'||m.type=='compra')&&m.src=='Caja'),m=>m.amt);
 const rc=sm(ms.filter(m=>m.type=='venta'&&m.pay=='Efectivo'),m=>m.amt);
 const nq=sm(ms.filter(m=>m.type=='venta'&&m.pay=='Nequi'),m=>m.amt),ot=sm(ms.filter(m=>m.type=='venta'&&m.pay=='Otro'),m=>m.amt);
 const has=c&&c.contado!=null;return{ms,caja,rc,nq,ot,contado:has?c.contado:null,cash:has?c.contado+caja:rc,closed:!!(c&&c.closed)}}
function agg(a,b){const r={ve:0,vn:0,vo:0,g:0,c:0,i:0,days:0,cat:{},prov:{},cred:0,ms:[]};
 for(let d=a;d<=b;d=addD(d,1)){const x=dayInfo(d);r.ve+=x.cash;r.vn+=x.nq;r.vo+=x.ot;if(x.cash+x.nq+x.ot>0)r.days++;
  x.ms.forEach(m=>{r.ms.push(m);if(m.type=='gasto'){r.g+=m.amt;r.cat[m.cat||'Otros']=(r.cat[m.cat||'Otros']||0)+m.amt}
  if(m.type=='compra'){r.c+=m.amt;r.prov[m.prov||'Sin proveedor']=(r.prov[m.prov||'Sin proveedor']||0)+m.amt;if(m.src=='Crédito')r.cred+=m.amt}
  if(m.type=='ingreso'&&!m.auto)r.i+=m.amt})}
 r.v=r.ve+r.vn+r.vo;r.avg=r.days?r.v/r.days:0;return r}
function funds(){let B=+S.cfg.base0||0,N=+S.cfg.nequi0||0;
 S.movs.forEach(m=>{const add=(f,v)=>{if(f=='Base')B+=v;if(f=='Nequi')N+=v};
  if(OUT.includes(m.type))add(m.src,-m.amt);
  if(m.type=='ingreso')add(m.src,m.amt);if(m.type=='traslado'){add(m.src,-m.amt);add(m.to,m.amt)}});
 for(const d in S.cu){const c=S.cu[d];if(c.closed||c.contado!=null){/* ventas nequi ya son movimientos */}}
 N+=sm(S.movs.filter(m=>m.type=='venta'&&m.pay=='Nequi'),m=>m.amt);return{B,N}}
const card=(k,v,c='')=>`<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
function vbars(it){const mx=Math.max(1,...it.map(x=>x.v));return`<div class="vb">${it.map(x=>`<div title="${fm(x.v)}">${x.v?Math.round(x.v/1000)+'k':''}<i style="height:${x.v/mx*85}%"></i>${x.l}</div>`).join('')}</div>`}
function hbars(o){const it=Object.entries(o).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...it.map(x=>x[1]));return it.length?it.map(([l,v])=>`<div class="hb"><b>${e(l)}</b><u><i style="width:${v/mx*100}%"></i></u><em>${fm(v)}</em></div>`).join(''):'<div class="k">Sin datos</div>'}
function summ(t,r){return`<h2>${t}</h2><div class="g">${card('Ventas',fm(r.v),'pos')}${card('Gastos',fm(r.g))}${card('Compras',fm(r.c))}${card('Promedio diario',fm(r.avg))}</div>`}
function vInicio(){const t=td(),x=dayInfo(t),f=funds(),r=agg(t,t),w=agg(mon(t),addD(mon(t),6)),m=agg(mS(t),mE(t));
 const dn=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
 const wk=dn.map((l,i)=>({l,v:agg(addD(mon(t),i),addD(mon(t),i)).v}));
 const ms=mS(t),me=mE(t),wm=[0,1,2,3].map(i=>({l:'Sem '+(i+1),v:agg(addD(ms,i*7),i==3?me:addD(ms,i*7+6)).v}));
 const y=P(t).getFullYear(),yr=Array.from({length:12},(_,i)=>({l:new Date(y,i,1).toLocaleDateString('es-CO',{month:'short'}).slice(0,3),v:agg(F(new Date(y,i,1)),F(new Date(y,i+1,0))).v}));
 return`<h1>${e(S.cfg.name)}</h1><div class="k">${dfl(t)}</div><h2>Hoy</h2><div class="g">${card('Ventas',fm(r.v),'pos')}${card('Gastos',fm(r.g))}${card('Compras',fm(r.c))}${card('Efectivo en caja',x.contado==null?'sin contar':fm(x.contado))}${card('Base',fm(f.B))}${card('Nequi',fm(f.N))}</div>
 ${summ('Esta semana',w)}${summ('Este mes',m)}
 <div class="c2"><div><h2>Ventas por día (semana)</h2><div class="card">${vbars(wk)}</div></div><div><h2>Ventas por semana (mes)</h2><div class="card">${vbars(wm)}</div></div></div>
 <h2>Ventas por mes (${y})</h2><div class="card">${vbars(yr)}</div>`}
function vMov(){const L=S.movs.filter(m=>(!flt.a||m.date>=flt.a)&&(!flt.b||m.date<=flt.b)&&(!flt.t||m.type==flt.t)&&(!flt.s||m.src==flt.s||m.pay==flt.s)&&(!flt.c||m.cat==flt.c)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 const o=(a,v)=>a.map(x=>`<option value="${x}" ${v==x?'selected':''}>${x}</option>`).join('');
 return`<h1>Movimientos</h1><div class="card"><div class="row"><div><label>Desde</label><input type="date" value="${flt.a}" onchange="flt.a=this.value;render()"></div><div><label>Hasta</label><input type="date" value="${flt.b}" onchange="flt.b=this.value;render()"></div></div>
 <div class="row"><div><label>Tipo</label><select onchange="flt.t=this.value;render()"><option value="">Todos</option>${Object.keys(TN).map(k=>`<option value="${k}" ${flt.t==k?'selected':''}>${TN[k]}</option>`).join('')}</select></div>
 <div><label>Fuente</label><select onchange="flt.s=this.value;render()"><option value="">Todas</option>${o(['Base','Nequi','Caja','Crédito','Efectivo','Otro'],flt.s)}</select></div>
 <div><label>Categoría</label><select onchange="flt.c=this.value;render()"><option value="">Todas</option>${o(S.cfg.cats,flt.c)}</select></div></div></div>
 <div class="k" style="margin:8px 0">${L.length} movimientos · total ${fm(sm(L.filter(m=>m.type!='traslado'),m=>m.amt))} (sin traslados)</div>
 <div class="card tw"><table><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th>Fuente</th><th class="r">Valor</th><th></th></tr>${L.slice(0,300).map(m=>`<tr><td>${dl(m.date)} ${m.time||''}</td><td>${TN[m.type]}</td><td>${e(m.type=='compra'?(m.prov||'')+(m.inv?' #'+m.inv:''):m.type=='traslado'?m.src+' → '+m.to:m.concept||m.note||'')}</td><td>${e(m.type=='venta'?m.pay:m.src)}</td><td class="r ${m.type=='gasto'||m.type=='compra'?'neg':''}">${fm(m.amt)}</td><td><a href="#" onclick="delMov('${m.id}');return false">🗑</a></td></tr>`).join('')||'<tr><td colspan="6">Sin movimientos</td></tr>'}</table></div>`}
function vCuadre(){const x=dayInfo(cdate),c=S.cu[cdate]||{},lk=x.closed,f=funds();
 const nqv=c.nequi!=null&&!lk?c.nequi:x.nq,ct=c.contado,ve=ct!=null?ct+x.caja:x.rc,all=agg(cdate,cdate);
 const gb=sm(x.ms.filter(m=>(m.type=='gasto'||m.type=='compra')&&m.src=='Base'),m=>m.amt),gn=sm(x.ms.filter(m=>(m.type=='gasto'||m.type=='compra')&&m.src=='Nequi'),m=>m.amt);
 const hist=Object.keys(S.cu).sort().reverse().map(d=>{const y=agg(d,d);return`<tr onclick="cdate='${d}';render()" style="cursor:pointer"><td>${dl(d)}</td><td class="r">${fm(y.v)}</td><td class="r">${fm(y.g+y.c)}</td><td class="r">${S.cu[d].contado==null?'—':fm(S.cu[d].contado)}</td><td>${S.cu[d].closed?'🔒 Cerrado':'Abierto'}</td></tr>`}).join('');
 return`<h1>Cuadre del día</h1><input type="date" value="${cdate}" onchange="cdate=this.value;render()">${lk?'<div class="lock">🔒 Día cerrado: no se puede modificar</div>':''}
 <div class="card"><label>Efectivo contado en caja</label><input id="cc" inputmode="numeric" placeholder="$0" value="${ct!=null?ct:''}" ${lk?'disabled':''} oninput="cuLive()">
 <label>Ventas recibidas por Nequi del día</label><input id="cn" inputmode="numeric" value="${nqv}" ${lk?'disabled':''} oninput="cuLive()">
 <div id="cl"></div>
 ${lk?`<button class="b d" onclick="reopen()">Reabrir cuadre</button>`:`<div class="row"><button class="b s" onclick="cuSave(0)">Guardar</button><button class="b" onclick="cuSave(1)">Cerrar día</button></div>`}</div>
 <h2>Gastos del día</h2><div class="g">${card('Desde Base',fm(gb))}${card('Desde Nequi',fm(gn))}${card('Desde Caja',fm(x.caja))}${card('Gastos',fm(all.g))}${card('Compras',fm(all.c))}${card('Ingresos',fm(all.i))}</div>
 <h2>Fondos actuales</h2><div class="g">${card('Base',fm(f.B))}${card('Nequi',fm(f.N))}</div>
 <h2>Historial de cuadres</h2><div class="card tw"><table><tr><th>Día</th><th class="r">Ventas</th><th class="r">Gastos+compras</th><th class="r">Caja</th><th>Estado</th></tr>${hist||'<tr><td colspan="5">Aún no hay cuadres</td></tr>'}</table></div>`}
let qa={src:'Caja',type:'compra'};
function cuKeep(){const a=$('cc'),b=$('cn');if(!a||(S.cu[cdate]&&S.cu[cdate].closed))return;const v=q=>q.value.replace(/\D/g,'');S.cu[cdate]={contado:v(a)===''?null:+v(a),nequi:+v(b)||0,closed:false}}
function qaRefresh(){['compra','gasto'].forEach(t=>$('qt_'+t).classList.toggle('on',qa.type==t));['Caja','Base','Nequi','Crédito'].forEach(s=>$('qs_'+s).classList.toggle('on',qa.src==s));$('q_catw').style.display=qa.type=='gasto'?'block':'none'}
function qaSet(k,v){qa[k]=v;qaRefresh()}
function qaCon(v){const m=(S.map||{})[v.trim().toLowerCase()];if(m){qa.type=m.type;if(m.cat)$('q_cat').value=m.cat;qaRefresh()}}
function qaAdd(){const n=$('q_con').value.trim(),amt=+$('q_amt').value.replace(/\D/g,'');if(!n||!amt){alert('Escribe concepto y valor');return}if(locked(cdate))return;
 const m={id:'m'+Date.now()+Math.random().toString(36).slice(2,5),date:cdate,time:new Date().toTimeString().slice(0,5),type:qa.type,amt,src:qa.src};
 if(qa.type=='gasto'){m.concept=n;m.cat=$('q_cat').value}else{m.prov=n;m.concept='Compra mercancía';if(!S.cfg.provs.includes(n))S.cfg.provs.push(n)}
 (S.map=S.map||{})[n.toLowerCase()]={n,type:qa.type,cat:m.cat||''};cuKeep();credDebt(m);S.movs.push(m);save();render();setTimeout(()=>{const i=$('q_con');i&&i.focus()},50)}
function delL(id){cuKeep();delMov(id)}
function share(){cuKeep();const x=dayInfo(cdate),c=S.cu[cdate]||{},ct=c.contado,nq=c.nequi!=null?c.nequi:x.nq,ve=ct!=null?ct+x.caja:x.rc,f=funds();
